# GameVault on a Synology (Container Manager → Project → Create → paste this file).
# Works the same on any Linux host with Docker: change the left-hand paths.
services:
  gamevault:
    image: ghcr.io/cnbailey/gamevault-server:latest
    pull_policy: always                   # "Build" in Container Manager always fetches the newest version
    container_name: gamevault
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"   # let the updater below update this container
    ports:
      - "8686:8686"                       # open http://<nas-ip>:8686
    environment:
      TZ: Europe/London
      # Library folders inside the container and their type.
      GV_LIBRARIES: /games/PS5=PS5,/games/PS4=PS4
      # Conversion service (switch it on in Settings): drop games in
      #   \\synology\Games\_incoming\PS5   and   \\synology\Games\_incoming\PS4
      GV_INCOMING: /games/_incoming
      GV_SCAN_INTERVAL_HOURS: "6"
      # Optional: IGDB credentials can also be entered on the Settings page.
      # IGDB_CLIENT_ID: ""
      # IGDB_CLIENT_SECRET: ""
    volumes:
      - /volume1/docker/gamevault:/data   # database + cached artwork
      # The whole Games share, so finished conversions move into the library instantly
      # (no copying). Needs write access for the conversion service and "Tidy file names".
      - /volume1/Games:/games
      # USB drives plugged into the NAS, for the "USB drive" tab (copy games to a drive
      # for the PS5). Remove the # from these two lines, then Build the project again.
      # "rslave" lets GameVault see a drive plugged in later. If Build fails with
      # "not a shared or slave mount", delete ":rslave" (then plug the drive in first).
      # - /volumeUSB1:/usb/1:rslave
      # - /volumeUSB2:/usb/2:rslave

  # Nightly auto-update: checks for a new GameVault image at 04:00 and restarts with it.
  # Only touches containers labelled above. Remove this block to update by hand instead.
  updater:
    image: nickfedor/watchtower:latest
    container_name: gamevault-updater
    restart: unless-stopped
    environment:
      TZ: Europe/London
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"   # sec min hour day month weekday
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"           # delete the old image after updating
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
